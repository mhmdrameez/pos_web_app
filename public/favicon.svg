<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Bolt Flash Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Inner Lighting Rim -->
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Main POS Register / Card Terminal Base -->
  <g filter="url(#dropShadow)">
    <!-- Terminal Main Body -->
    <rect x="110" y="100" width="292" height="312" rx="36" fill="#0F172A" />
    <rect x="112" y="102" width="288" height="308" rx="34" fill="none" stroke="#334155" stroke-width="3" />

    <!-- Terminal Screen Header / Display Area -->
    <rect x="138" y="132" width="236" height="134" rx="20" fill="#1E293B" />
    
    <!-- Screen Header Bar (Green POS indicator) -->
    <circle cx="162" cy="156" r="6" fill="#10B981" />
    <rect x="178" y="152" width="60" height="8" rx="4" fill="#64748B" />
    <rect x="310" y="152" width="44" height="8" rx="4" fill="#3B82F6" />

    <!-- POS Digital Total Amount on Screen -->
    <text x="256" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">₹ 0.00</text>

    <!-- Keypad Grid (Subtle tactile buttons) -->
    <!-- Row 1 -->
    <rect x="138" y="286" width="66" height="30" rx="8" fill="#334155" />
    <rect x="223" y="286" width="66" height="30" rx="8" fill="#334155" />
    <rect x="308" y="286" width="66" height="30" rx="8" fill="#334155" />

    <!-- Row 2 -->
    <rect x="138" y="326" width="66" height="30" rx="8" fill="#334155" />
    <rect x="223" y="326" width="66" height="30" rx="8" fill="#334155" />
    <rect x="308" y="326" width="66" height="30" rx="8" fill="#334155" />

    <!-- Row 3 (Action row: Cash, UPI, Pay) -->
    <rect x="138" y="366" width="66" height="26" rx="8" fill="#475569" />
    <rect x="223" y="366" width="66" height="26" rx="8" fill="#475569" />
    <rect x="308" y="366" width="66" height="26" rx="8" fill="#10B981" />
  </g>

  <!-- Speed Lightning Bolt Symbol (Signifying "Quick Sale") -->
  <g filter="url(#boltGlow)">
    <path d="M380 90 L310 220 L355 220 L290 350 L420 195 L370 195 Z" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>