<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Bolt Flash Gradient -->
    <linearGradient id="pwaBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for Terminal -->
    <filter id="pwaShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.45" />
    </filter>

    <filter id="pwaBoltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#pwaBgGrad)" />

  <!-- Subtle Inner Lighting Rim -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" />

  <!-- Main POS Register / Card Terminal Base -->
  <g filter="url(#pwaShadow)">
    <!-- Terminal Main Body -->
    <rect x="106" y="94" width="300" height="324" rx="40" fill="#0F172A" />
    <rect x="108" y="96" width="296" height="320" rx="38" fill="none" stroke="#334155" stroke-width="4" />

    <!-- Terminal Screen Display Area -->
    <rect x="134" y="128" width="244" height="138" rx="22" fill="#1E293B" />
    
    <!-- Screen Header Bar (Green POS indicator & status dots) -->
    <circle cx="160" cy="152" r="7" fill="#10B981" />
    <rect x="178" y="148" width="64" height="8" rx="4" fill="#64748B" />
    <rect x="312" y="148" width="44" height="8" rx="4" fill="#38BDF8" />

    <!-- POS Digital Total Amount on Screen -->
    <text x="256" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">₹ 0.00</text>

    <!-- Keypad Grid (Buttons) -->
    <!-- Row 1 -->
    <rect x="136" y="288" width="68" height="32" rx="10" fill="#334155" />
    <rect x="222" y="288" width="68" height="32" rx="10" fill="#334155" />
    <rect x="308" y="288" width="68" height="32" rx="10" fill="#334155" />

    <!-- Row 2 -->
    <rect x="136" y="330" width="68" height="32" rx="10" fill="#334155" />
    <rect x="222" y="330" width="68" height="32" rx="10" fill="#334155" />
    <rect x="308" y="330" width="68" height="32" rx="10" fill="#334155" />

    <!-- Row 3 (Action row: Cash, UPI, Pay) -->
    <rect x="136" y="372" width="68" height="28" rx="9" fill="#475569" />
    <rect x="222" y="372" width="68" height="28" rx="9" fill="#475569" />
    <rect x="308" y="372" width="68" height="28" rx="9" fill="#10B981" />
  </g>

  <!-- Speed Lightning Bolt Symbol (Signifying "Quick Sale") -->
  <g filter="url(#pwaBoltGlow)">
    <path d="M388 80 L314 220 L362 220 L292 360 L432 195 L378 195 Z" fill="url(#pwaBoltGrad)" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>
